name: Loku
description: Loku was a travel and local-experiences recommendation startup, founded around 2010, that
  provided personalized recommendations from local experts. The company raised roughly $2.1M in seed funding
  and was acquired by Groupon in July 2013, after which the product was shut down. Loku is no longer an
  operating company. Its former domain, loku.com, no longer hosts a product and now redirects to an Afternic
  "domain for sale" listing. This profile was surfaced as a 500 Global portfolio lead; enrichment confirms
  there is no live API, developer portal, documentation, or product surface to catalog.
